name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh Google Scholar citation count daily at 03:00 UTC
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # If your repo is NOT named "<username>.github.io" and you are NOT using a custom domain,
      # set NEXT_PUBLIC_BASE_PATH to "/your-repo-name" in the next step.
      - name: Build
        run: npm run build
        env:
          # Custom domain (mdsifathossain.com) — no basePath needed.
          NEXT_PUBLIC_BASE_PATH: ''
      - name: Add .nojekyll
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
